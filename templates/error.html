<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>錯誤</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { font-size: 18px; color: #333; margin-bottom: 8px; }
    p { font-size: 14px; color: #888; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h2>{{ title | default("發生錯誤") }}</h2>
    <p>{{ message | default("請關閉此頁面，從 LINE 群組重新點擊連結。") }}</p>
  </div>
</body>
</html>
