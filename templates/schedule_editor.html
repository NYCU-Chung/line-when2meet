<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>空閒時間填寫</title>
  <link rel="stylesheet" href="/static/css/schedule.css" />
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
</head>
<body>

<!-- Loading 畫面 -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">登入中...</div>
</div>

<!-- 主內容（登入後顯示）-->
<div id="main-content" style="display:none">

  <!-- 頂部 Header -->
  <header class="app-header">
    <h1>空閒時間填寫</h1>
    <div class="user-info">👤 <span id="user-name"></span></div>
    <div class="help-row">
      <button type="button" class="help-toggle" id="schedule-help-toggle" aria-expanded="false">查看操作教學</button>
      <span class="help-inline-tip">支援拖曳一次選取多格</span>
    </div>
    <div class="help-panel" id="schedule-help-panel" aria-hidden="true">
      <div class="help-panel-title">30 秒快速上手</div>
      <div class="help-steps">
        <div class="help-step"><span class="help-step-num">1</span><span>先點「筆刷」選擇狀態</span></div>
        <div class="help-step"><span class="help-step-num">2</span><span>在課表格子上拖曳，一次塗多格</span></div>
        <div class="help-step"><span class="help-step-num">3</span><span>單點格子可編輯備註，系統會自動儲存</span></div>
      </div>
      <div class="help-panel-actions">
        <button type="button" class="help-dismiss" id="schedule-help-close">我知道了</button>
      </div>
    </div>

    <!-- 筆刷（拖曳一次後自動關閉） -->
    <div class="brushbar">
      <div class="brushbar-title">筆刷</div>
      <div class="brushbar-buttons" id="brushbar">
        <button type="button" class="brush-btn" data-status="1">📚 上課</button>
        <button type="button" class="brush-btn" data-status="2">🔴 忙碌</button>
        <button type="button" class="brush-btn" data-status="4">😴 睡覺</button>
        <button type="button" class="brush-btn" data-status="5">🏠 回家</button>
        <button type="button" class="brush-btn" data-status="3">⚪ 其他</button>
        <button type="button" class="brush-btn brush-btn-erase" data-status="0">✅ 有空</button>
      </div>
      <div class="brushbar-state" id="brush-state">已關閉</div>
    </div>
  </header>

  <div class="content-padding">
    <!-- Day Carousel -->
    <div class="carousel-wrapper">
      <div class="day-carousel" id="day-carousel"></div>
    </div>
  </div>
  <div class="page-xscroll" id="page-xscroll" aria-hidden="true">
    <div class="page-xscroll-spacer" id="page-xscroll-spacer"></div>
  </div>

  <!-- 固定儲存按鈕 -->
  <div class="save-bar">
    <div class="save-meta" id="save-meta" aria-live="polite">尚未變更</div>
    <button class="save-btn" id="save-btn">儲存</button>
  </div>
</div>

<!-- 格子編輯 Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>

	    <div class="status-options">
	      <div class="status-option" data-status="0">✅ 有空</div>
	      <div class="status-option" data-status="1">📚 上課</div>
	      <div class="status-option" data-status="2">🔴 忙碌</div>
	      <div class="status-option" data-status="4">😴 睡覺</div>
	      <div class="status-option" data-status="5">🏠 回家</div>
	      <div class="status-option" data-status="3">⚪ 其他</div>
	    </div>

    <div class="note-label">備註（選填，例如課名或活動）</div>
    <textarea class="note-input" id="modal-note" placeholder="最多 100 字" maxlength="100"></textarea>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">取消</button>
      <button class="btn-confirm" id="btn-confirm">確定</button>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- 注入 Flask 模板變數到 JS -->
<script>
  const LIFF_ID   = "{{ liff_id }}";
  const INITIAL_GROUP_ID = {{ group_id | tojson }};
  const DAY_CODES = {{ day_codes | tojson }};
  const DAY_NAMES = {{ day_names | tojson }};
  const SLOT_CODES = {{ slot_codes | tojson }};
  const SLOT_TIMES = {{ slot_times | tojson }};
</script>
<script src="/static/js/liff_init.js"></script>
<script src="/static/js/schedule_editor.js"></script>
</body>
</html>
