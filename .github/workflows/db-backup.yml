name: Database Backup

on:
  schedule:
    # Every day at 02:30 Asia/Taipei (18:30 UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/gcp_linebot
          chmod 600 ~/.ssh/gcp_linebot
          ssh-keyscan -H 35.212.245.209 >> ~/.ssh/known_hosts

      - name: Create backup via SSH
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP_FILE="when2meet-postgres-${TIMESTAMP}.dump"

          ssh -i ~/.ssh/gcp_linebot programchung@35.212.245.209 \
            "docker exec line-when2meet-db-1 pg_dump -U when2meet -F c when2meet > /tmp/${BACKUP_FILE}"

          scp -i ~/.ssh/gcp_linebot \
            programchung@35.212.245.209:/tmp/${BACKUP_FILE} \
            "${BACKUP_FILE}"

          ssh -i ~/.ssh/gcp_linebot programchung@35.212.245.209 \
            "rm /tmp/${BACKUP_FILE}"

          echo "BACKUP_FILE=${BACKUP_FILE}" >> "${GITHUB_ENV}"

      - name: Verify backup file
        run: |
          test -s "${BACKUP_FILE}"
          ls -lh "${BACKUP_FILE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
